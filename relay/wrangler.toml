# Slidemill relay (see docs/CLAUDE_CONNECTOR.md). Deploy: the "Deploy Claude relay" GitHub Action,
# or `npx wrangler deploy` from this folder.
name = "slidemill-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# SQLite-backed Durable Objects are on Cloudflare's free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
