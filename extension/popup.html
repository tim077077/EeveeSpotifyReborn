<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 320px; margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; }
    header { background: #fe2c55; color: #fff; padding: 10px 14px; font-weight: 700; }
    main { padding: 12px 14px 14px; display: grid; gap: 10px; }
    label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #777; display: block; margin-bottom: 3px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 12px; text-transform: none; letter-spacing: 0; color: inherit; font-weight: 400; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; border: 0; border-radius: 8px; padding: 9px; font-weight: 700; cursor: pointer; background: #eee; color: #111; }
    button.primary { background: #fe2c55; color: #fff; }
    #status { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: #f5f5f5; white-space: pre-wrap; }
    .muted { color: #888; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #ecedf0; }
      input[type=text], input[type=password] { background: #0e0f12; color: #ecedf0; border-color: #2a2e37; }
      button { background: #262a33; color: #ecedf0; }
      #status { background: #0e0f12; }
    }
  </style>
</head>
<body>
  <header>Slidemill TikTok Poster</header>
  <main>
    <div id="status">…</div>
    <div><label for="server">Slidemill address</label><input id="server" type="text" placeholder="http://localhost:8000"></div>
    <div><label for="key">Slidemill password</label><input id="key" type="password" placeholder="SLIDEMILL_API_KEY"></div>
    <label class="check"><input id="enabled" type="checkbox"> Post Slidemill's queue automatically</label>
    <label class="check"><input id="openTab" type="checkbox"> Open a tiktok.com tab by itself when needed</label>
    <div class="row"><button class="primary" id="save">Save</button><button id="test">Check now</button></div>
    <p class="muted">Keep a tiktok.com tab open and logged in. Slidemill decides when to post and caps posts per day.
      Posting this way is against TikTok's terms — use an account you can afford to lose.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
